<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <script src="assets/kit/kit.js"></script>
    <style>
      /* Mimi shots are full frames on the page colour; the wrapper moves and scales them. */
      #mimi { position: absolute; inset: 0; transform-origin: 480px 1330px; }
      #mimi video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* The real app in a phone frame (untimed; only the clips inside carry times) */
      #device { position: absolute; left: 540px; top: 470px; width: 480px; height: 1044px; border-radius: 74px; background: #1d2733; padding: 14px;
                box-shadow: 0 30px 70px rgba(39, 59, 75, 0.28); opacity: 0; }
      #screen { position: relative; width: 100%; height: 100%; border-radius: 60px; overflow: hidden; background: #f4f6f9; }
      #zoom { position: absolute; inset: 0; transform-origin: 50% 20%; }
      #zoom video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* The QA fixture writes "QA用データ" into feedback text; cover those lines (white like the card) */
      .mask { position: absolute; left: 5%; right: 5%; background: #ffffff; border-radius: 6px; }
      .tap { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 6px solid #2a8dff; background: rgba(42, 141, 255, 0.18); }
      #books { position: absolute; left: 560px; top: 560px; width: 400px; height: auto; transform-origin: 30% 100%; }
      .card { position: absolute; left: 40px; right: 40px; background: #ffffff; border-radius: 36px; padding: 26px 34px;
              box-shadow: 0 18px 50px rgba(39, 59, 75, 0.22); font-size: 48px; font-weight: 700; line-height: 1.5; color: #273b4b; }
      .card s { color: #e5484d; text-decoration: none; } .card b { color: #2a8dff; } .card small { display: block; font-size: 34px; color: #596875; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="mimi">
          <video id="v-hook" class="clip" src="assets/shots/hook.mp4" muted playsinline data-start="0" data-duration="2.0" data-track-index="0"></video>
          <video id="v-present" class="clip" src="assets/shots/present.mp4" muted playsinline data-start="2.0" data-duration="1.4" data-track-index="0"></video>
          <video id="v-listen" class="clip" src="assets/shots/listen.mp4" muted playsinline data-start="3.4" data-duration="2.2" data-track-index="0"></video>
          <video id="v-record" class="clip" src="assets/shots/record.mp4" muted playsinline data-start="5.6" data-duration="2.0" data-track-index="0"></video>
          <video id="v-think" class="clip" src="assets/shots/think.mp4" muted playsinline data-start="7.6" data-duration="2.0" data-track-index="0"></video>
          <video id="v-point2" class="clip" src="assets/shots/point2.mp4" muted playsinline data-start="9.6" data-duration="2.2" data-track-index="0"></video>
          <video id="v-jump" class="clip" src="assets/shots/jump.mp4" muted playsinline data-start="11.8" data-duration="0.7" data-track-index="0"></video>
          <video id="v-success" class="clip" src="assets/shots/success.mp4" muted playsinline data-start="12.5" data-duration="1.5" data-track-index="0"></video>
        </div>

        <!-- Hook: the pile of study books that never gets read -->
        <img id="books" class="clip" src="assets/books.webp" alt="" data-start="0" data-duration="2.0" data-track-index="1" />

        <!-- The real app (simulator recording, QA fixture data) -->
        <div id="device">
          <div id="screen">
            <div id="zoom">
              <video id="a-home" class="clip" src="assets/app/home.mp4" muted playsinline data-start="2.0" data-duration="1.4" data-track-index="3"></video>
              <video id="a-lesson" class="clip" src="assets/app/lesson.mp4" muted playsinline data-start="3.4" data-duration="2.2" data-track-index="3"></video>
              <video id="a-rec" class="clip" src="assets/app/rec.mp4" muted playsinline data-start="5.6" data-duration="2.0" data-media-start="0.3" data-track-index="3"></video>
              <video id="a-score" class="clip" src="assets/app/lesson.mp4" muted playsinline data-start="7.6" data-duration="2.0" data-media-start="0.3" data-track-index="3"></video>
              <video id="a-tip" class="clip" src="assets/app/tip.mp4" muted playsinline data-start="9.6" data-duration="4.4" data-track-index="3"></video>
              <div class="mask clip" style="top:72.5%; height:8%" data-start="3.4" data-duration="2.2" data-track-index="5"></div>
              <div class="mask clip" style="top:67.5%; height:6%" data-start="5.6" data-duration="2.0" data-track-index="5"></div>
              <div class="mask clip" style="top:72.5%; height:8%" data-start="7.6" data-duration="2.0" data-track-index="5"></div>
              <div class="mask clip" style="top:26.5%; height:7%" data-start="9.6" data-duration="4.4" data-track-index="5"></div>
              <div class="mask clip" style="top:54%; height:5%" data-start="9.6" data-duration="4.4" data-track-index="6"></div>
            </div>
            <div id="tap1" class="tap clip" style="left:30%; top:46%" data-start="3.05" data-duration="0.3" data-track-index="4"></div>
            <div id="tap2" class="tap clip" style="left:37%; top:87%" data-start="5.7" data-duration="0.3" data-track-index="4"></div>
          </div>
        </div>
      </div>

      <div id="spark" class="sparkles clip" data-start="11.8" data-duration="2.2" data-track-index="5"></div>

      <!-- Captions (one track) -->
      <div id="cap-1" class="caption clip" data-start="0" data-duration="1.3" data-track-index="9"><span id="c1" style="font-size:72px">英語の本、増えるだけ…</span></div>
      <div id="cap-2" class="caption clip" data-start="1.3" data-duration="0.7" data-track-index="9"><span id="c2" style="font-size:96px">積読。</span></div>
      <div id="cap-3" class="caption small clip" data-start="2.0" data-duration="1.4" data-track-index="9"><span id="c3">やることは、<br />毎日アプリが決める。</span></div>
      <div id="cap-4" class="caption small clip" data-start="3.4" data-duration="2.2" data-track-index="9"><span id="c4">自分の声が、<br /><strong>ネイティブ発音のお手本に。</strong></span></div>
      <div id="cap-5" class="caption small clip" data-start="5.6" data-duration="2.0" data-track-index="9"><span id="c5">まねして、話すだけ。</span></div>
      <div id="cap-6" class="caption small clip" data-start="7.6" data-duration="2.0" data-track-index="9"><span id="c6">5つの視点で、すぐ採点。</span></div>
      <div id="cap-7" class="caption small clip" data-start="9.6" data-duration="2.2" data-track-index="9"><span id="c7">苦手な音が、<br />ひと目でわかる。</span></div>
      <div id="cap-8" class="caption small clip" data-start="11.8" data-duration="2.2" data-track-index="9"><span id="c8">1日10分、<br /><strong>自分の声で。</strong></span></div>

      <div id="tag-model" class="tag model clip" style="top:1560px" data-start="3.75" data-duration="1.85" data-track-index="10"><span id="t1">▶ 自分の声のお手本</span></div>
      <div id="tag-rec" class="tag model clip" style="top:1560px" data-start="5.75" data-duration="1.85" data-track-index="10"><span id="t2">● 録音</span></div>

      <!-- The one thing to read: L, not R (the app's tip, readable) -->
      <div id="tipcard" class="card clip" style="top:1000px; text-align:center; font-size:72px" data-start="9.9" data-duration="1.9" data-track-index="11"><s>right</s> → <b>light</b><small>L は、舌先を上の歯ぐきに。</small></div>

      <div id="end" class="end clip" data-start="14.0" data-duration="1.0" data-track-index="12"></div>

      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="15" data-track-index="13" data-volume="1"></audio>
    </div>
    <script>
      const K = window.MimiKit;
      K.sparkles(document.getElementById("spark"), [[120, 820], [380, 760, "#7cc3ff"], [80, 1100], [400, 1050, "#7cc3ff"]]);
      K.endCard(document.getElementById("end"), "自分の声で、ネイティブの発音を。", "7日間無料ではじめる");

      const tl = gsap.timeline({ paused: true });
      const k = K.kit(tl);

      // Mimi: big beside the books, then small beside the phone
      tl.fromTo("#mimi", { x: -130, y: 120, scale: 0.84 }, { x: -130, y: 120, scale: 0.86, duration: 2.0, ease: "none" }, 0);
      tl.fromTo("#mimi", { x: -130, y: 120, scale: 0.86 }, { x: -240, y: 150, scale: 0.55, duration: 0.35, ease: "power3.inOut", immediateRender: false }, 2.0);

      // Books: stack up book by book (clip from the bottom), wobble, topple at 1.4
      tl.fromTo("#books", { clipPath: "inset(55% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "steps(4)" }, 0.05);
      tl.to("#books", { keyframes: [{ rotation: -3, duration: 0.12 }, { rotation: 3, duration: 0.12 }, { rotation: -2, duration: 0.1 }] }, 1.0);
      tl.to("#books", { rotation: 70, x: 260, y: 200, opacity: 0, duration: 0.45, ease: "power2.in" }, 1.4);

      // The phone; zooms on the sentence, the score and the tip
      tl.fromTo("#device", { x: 420, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.0);
      tl.fromTo("#zoom", { scale: 1, transformOrigin: "50% 8%" }, { scale: 1.15, transformOrigin: "50% 8%", duration: 0.5, ease: "power2.inOut" }, 3.6);
      tl.set("#zoom", { scale: 1 }, 5.6);
      tl.fromTo("#zoom", { scale: 1, transformOrigin: "50% 22%" }, { scale: 1.35, transformOrigin: "50% 22%", duration: 0.5, ease: "power2.inOut", immediateRender: false }, 7.7);
      tl.set("#zoom", { scale: 1, transformOrigin: "50% 20%" }, 9.6);
      k.ripple("#tap1", 3.05); k.ripple("#tap2", 5.7);
      tl.fromTo("#tipcard", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(1.8)" }, 9.9);

      k.twinkle("#spark", 11.85);

      tl.set("#c1", { opacity: 1, scale: 1 }, 0);
      tl.fromTo("#c2", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "back.out(2)" }, 1.3);
      k.pop("#c3", 2.0); k.pop("#c4", 3.4); k.pop("#c5", 5.6); k.pop("#c6", 7.6); k.pop("#c7", 9.6); k.pop("#c8", 11.8);
      k.tagIn("#t1", 3.75); k.tagIn("#t2", 5.75);
      k.end(14.0);
      k.tapCta(14.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
